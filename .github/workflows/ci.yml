name: CI

on:
  push:
    paths:
      - "**.go"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "**.go"
      - ".github/workflows/ci.yml"

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    # The GUI needs a recent libadwaita, newer than Ubuntu ships.
    container: archlinux:latest

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git go gtk4 libadwaita libgirepository golangci-lint gofumpt uv

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-arch-${{ hashFiles('go.sum') }}
          restore-keys: go-arch-

      # Compiling the GTK bindings takes several minutes, so warm the cache
      # before golangci-lint runs under its timeout.
      - name: Build
        run: go build ./...

      - name: Run Pre-commit
        run: |
          uvx pre-commit run -a
