version: 2

builds:
  # The capture dialogue needs CGO and a recent GTK 4 with libadwaita, so it is
  # built for x86_64 only.
  - id: gui
    env:
      - CGO_ENABLED=1
    main: ./cmd/tequilashot
    binary: tequilashot
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -w
      - -s
      - -X github.com/chmouel/tequilashot/internal/gui.Version={{ .Version }}
  - id: cli
    env:
      - CGO_ENABLED=0
    main: ./cmd/tequilashot
    flags:
      - -tags=nogui
    binary: tequilashot
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -w
      - -s
archives:
  - id: gui
    ids:
      - gui
    name_template: >-
      {{ .Binary }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
      - src: assets/com.chmouel.Tequilashot.Recorder.desktop
        dst: com.chmouel.Tequilashot.Recorder.desktop
      - src: assets/tequilashot-mark.svg
        dst: tequilashot-mark.svg
  - id: cli
    ids:
      - cli
    name_template: >-
      tequilashot-nogui_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
checksum:
  name_template: "checksums.txt"

release:
  prerelease: "false"

nfpms:
  - id: gui
    ids:
      - gui
    file_name_template: >-
      tequilashot-
      {{- .Version}}_{{.Os}}-
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else }}{{ .Arch }}{{ end }}
    homepage: https://github.com/chmouel/tequilashot
    description: "Tequilashot - screenshots and screen recording for Wayland"
    maintainer: Chmouel Boudjnah <chmouel@chmouel.com>
    license: Apache 2.0
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: ./LICENSE
        dst: /usr/share/licenses/tequilashot/LICENSE
      - src: ./assets/com.chmouel.Tequilashot.Recorder.desktop
        dst: /usr/share/applications/com.chmouel.Tequilashot.Recorder.desktop
      - src: ./assets/tequilashot-mark.svg
        dst: /usr/share/icons/hicolor/scalable/apps/com.chmouel.Tequilashot.Recorder.svg
    overrides:
      deb:
        dependencies:
          - libgtk-4-1
          - libadwaita-1-0 (>= 1.9)
          - libgirepository-1.0-1
      rpm:
        dependencies:
          - gtk4
          - libadwaita >= 1.9
          - gobject-introspection
  - id: cli
    ids:
      - cli
    file_name_template: >-
      tequilashot-
      {{- .Version}}_{{.Os}}-
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else }}{{ .Arch }}{{ end }}
    homepage: https://github.com/chmouel/tequilashot
    description: "Tequilashot - screenshots and screen recording for Wayland"
    maintainer: Chmouel Boudjnah <chmouel@chmouel.com>
    license: Apache 2.0
    formats:
      - apk
    bindir: /usr/bin
    contents:
      - src: ./LICENSE
        dst: /usr/share/licenses/tequilashot/LICENSE
changelog:
  sort: desc
  use: git
  groups:
    - title: Features
      regexp: '^feat(\([^)]+\))?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\([^)]+\))?:'
      order: 1
    - title: Performance
      regexp: '^perf(\([^)]+\))?:'
      order: 2
    - title: Other changes
      regexp: '.*'
      order: 999
  filters:
    exclude:
      - '^docs(\([^)]+\))?:'
      - '^test(\([^)]+\))?:'
      - '^chore(\([^)]+\))?:'
      - '^ci(\([^)]+\))?:'
      - "^Brew formula update"
      - Merge pull request
      - Merge branch
      - go mod tidy
      - Update README.md

aurs:
  - name: tequilashot-bin
    ids:
      - gui
    homepage: "https://github.com/chmouel/tequilashot"
    description: "Tequilashot - screenshots and screen recording for Wayland"
    maintainers:
      - "Chmouel Boudjnah <chmouel@chmouel.com>"
    license: Apache 2.0
    provides:
      - tequilashot
    conflicts:
      - tequilashot
      - sway-easyshot
      - sway-easyshot-bin
    depends:
      - gtk4
      - "libadwaita>=1:1.9"
      - libgirepository
    optdepends:
      - "gtk4-layer-shell: round camera bubble"
    private_key: "{{ .Env.AUR_PRIVATE_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/tequilashot-bin.git
    package: |-
      install -Dm755 "./tequilashot" "${pkgdir}/usr/bin/tequilashot"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/tequilashot/LICENSE"
      install -Dm644 "./com.chmouel.Tequilashot.Recorder.desktop" "${pkgdir}/usr/share/applications/com.chmouel.Tequilashot.Recorder.desktop"
      install -Dm644 "./tequilashot-mark.svg" "${pkgdir}/usr/share/icons/hicolor/scalable/apps/com.chmouel.Tequilashot.Recorder.svg"
