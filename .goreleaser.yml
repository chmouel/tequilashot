version: 2

builds:
  - env:
      - CGO_ENABLED=0
    main: ./cmd/tequilashot
    flags:
      - -tags=nogui
    binary: tequilashot
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -w
      - -s
archives:
  - name_template: >-
      {{ .Binary }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else }}{{ .Arch }}{{ end }}
checksum:
  name_template: "checksums.txt"

release:
  prerelease: "false"

nfpms:
  - file_name_template: >-
      tequilashot-
      {{- .Version}}_{{.Os}}-
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else }}{{ .Arch }}{{ end }}
    homepage: https://github.com/chmouel/tequilashot
    description: "Tequilashot - screenshots and screen recording for Wayland"
    maintainer: Chmouel Boudjnah <chmouel@chmouel.com>
    license: Apache 2.0
    formats:
      - apk
      - deb
      - rpm
    bindir: /usr/bin
changelog:
  sort: desc
  use: git
  groups:
    - title: Features
      regexp: '^feat(\([^)]+\))?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\([^)]+\))?:'
      order: 1
    - title: Performance
      regexp: '^perf(\([^)]+\))?:'
      order: 2
    - title: Other changes
      regexp: '.*'
      order: 999
  filters:
    exclude:
      - '^docs(\([^)]+\))?:'
      - '^test(\([^)]+\))?:'
      - '^chore(\([^)]+\))?:'
      - '^ci(\([^)]+\))?:'
      - '^build(\([^)]+\))?:'
      - "^Brew formula update"
      - Merge pull request
      - Merge branch
      - go mod tidy
      - Update README.md

aurs:
  - name: tequilashot-bin
    homepage: "https://github.com/chmouel/tequilashot"
    description: "Tequilashot - screenshots and screen recording for Wayland"
    maintainers:
      - "Chmouel Boudjnah <chmouel@chmouel.com>"
    license: Apache 2.0
    provides:
      - tequilashot
    conflicts:
      - tequilashot
      - sway-easyshot
      - sway-easyshot-bin
    private_key: "{{ .Env.AUR_PRIVATE_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/tequilashot-bin.git
    package: |-
      install -Dm755 "./tequilashot" "${pkgdir}/usr/bin/tequilashot"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/tequilashot/LICENSE"
